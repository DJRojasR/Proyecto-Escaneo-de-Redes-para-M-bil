org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---------------------------------------------------------------------------
# AdMob (anuncios)
# Mientras estas líneas estén comentadas, la app usa los IDs de PRUEBA de Google
# (seguros para desarrollar). Antes de publicar en Google Play, crea tu app en
# https://admob.google.com, descomenta las líneas y pon tus IDs reales.
# Los builds "debug" SIEMPRE usan anuncios de prueba, para que no hagas clic
# por error en tus propios anuncios reales (AdMob puede suspender tu cuenta).
# ---------------------------------------------------------------------------
#ADMOB_APP_ID=ca-app-pub-XXXXXXXXXXXXXXXX~YYYYYYYYYY
#ADMOB_INTERSTITIAL_ID=ca-app-pub-XXXXXXXXXXXXXXXX/ZZZZZZZZZZ

# URL pública de tu política de privacidad (obligatoria en Google Play)
#PRIVACY_POLICY_URL=https://tu-sitio.com/privacidad

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
